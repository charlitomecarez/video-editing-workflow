  *{margin:0;box-sizing:border-box}

  .t{font-family:var(--font-heading);font-size:56px;color:#000;background:var(--accent);padding:10px 28px}
  .s{font-family:var(--font-body);font-weight:700;font-size:34px;color:var(--fg);background:var(--bg);padding:8px 28px}

<div class="lt"><div class="t">{{title}}</div>{{#sub}}<div class="s">{{sub}}</div>{{/sub}}</div>
</body></html>
