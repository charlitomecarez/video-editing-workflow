<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;box-sizing:border-box}
  body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);background-image:radial-gradient(ellipse at center,rgba(255,255,255,.05),transparent 65%);color:var(--fg);font-family:var(--font-body);padding:120px 150px;display:flex;flex-direction:column;justify-content:center}
  .title{font-family:var(--font-heading);font-size:88px;line-height:1.05}
  .sub{font-size:40px;font-weight:600;opacity:.75;margin-top:14px}
  .track{position:relative;height:120px;margin-top:230px;background:rgba(255,255,255,.08);border-radius:60px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.15)}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:60px;background:var(--c)}
  .gap{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--accent) 0 14px,transparent 14px 28px);opacity:.9;border-radius:0 60px 60px 0}
  .mark{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap}
  .mark.top{bottom:150px}.mark.bottom{top:150px}
  .mark .n{font-family:var(--font-heading);font-size:72px;line-height:1}
  .mark .t{font-size:34px;font-weight:700;opacity:.8;margin-top:6px}
  .mark.top::after{content:"";display:block;width:4px;height:40px;background:currentColor;margin:10px auto 0;opacity:.6}
  .mark.bottom::before{content:"";display:block;width:4px;height:40px;background:currentColor;margin:0 auto 10px;opacity:.6}
  .callout{position:absolute;top:150px;transform:translateX(-50%);font-family:var(--font-heading);font-size:60px;color:#000;background:var(--accent);padding:12px 30px;border-radius:12px;white-space:nowrap}
  .start{position:absolute;left:30px;top:50%;transform:translateY(-50%);font-weight:800;font-size:30px;opacity:.7}
  .footer{position:absolute;right:60px;bottom:40px;font-size:26px;opacity:.55}
</style></head><body style="--c:{{color}}">
<div class="title">{{title}}</div>
{{#sub}}<div class="sub">{{sub}}</div>{{/sub}}
<div class="track" id="track"><div class="fill" id="fill"></div><div class="gap" id="gap"></div><div class="start" id="start"></div></div>
<template id="d"><i>{{value}}</i><i>{{target}}</i><i>{{start}}</i><i>{{gap_label}}</i><i>{{value_label}}</i><i>{{target_label}}</i></template>
{{#footer}}<div class="footer">{{footer}}</div>{{/footer}}
<script>
  if (!getComputedStyle(document.body).getPropertyValue("--c").trim()) document.body.style.setProperty("--c", "var(--accent)");
  const [v, t, s, gl, vl, tl] = [...document.getElementById("d").content.querySelectorAll("i")].map((x) => x.innerHTML.trim());
  const V = parseFloat(v.replace(/,/g, "")), T = parseFloat(t.replace(/,/g, "")), S = parseFloat((s || "0").replace(/,/g, "")) || 0;
  const pct = (x) => Math.max(0, Math.min(100, ((x - S) / (T - S)) * 100));
  const f = (x) => x.toLocaleString("en-US");
  const track = document.getElementById("track");
  // Leave room on the right for the target label
  track.style.marginRight = "120px";
  document.getElementById("fill").style.width = pct(V) + "%";
  Object.assign(document.getElementById("gap").style, { left: pct(V) + "%", width: pct(T) - pct(V) + "%" });
  if (S) document.getElementById("start").textContent = f(S);
  track.insertAdjacentHTML("beforeend",
    `<div class="mark top" style="left:${pct(V)}%"><div class="n">${f(V)}</div><div class="t">${vl}</div></div>` +
    `<div class="mark bottom" style="left:${pct(T)}%;color:var(--fg)"><div class="n">${f(T)}</div><div class="t">${tl}</div></div>` +
    `<div class="callout" style="left:${(pct(V) + pct(T)) / 2 - 22}%">${gl || f(T - V) + " to go"}</div>`);
</script>
</body></html>
