<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  .frame{position:relative;width:100%;height:100%;display:flex;align-items:center;gap:40px;padding:0 70px;
    background:radial-gradient(circle at 26% 50%, color-mix(in srgb,{{{glow}}} 30%, transparent) 0%, transparent 45%),
      linear-gradient(135deg,var(--bg),color-mix(in srgb,var(--bg) 70%,#000));overflow:hidden}
  .frame::after{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:48px 48px;pointer-events:none}
  .icon{flex:0 0 42%;display:flex;justify-content:center;z-index:1}
  .icon img{max-width:100%;max-height:520px;filter:drop-shadow(0 0 40px color-mix(in srgb,{{{glow}}} 70%,transparent)) drop-shadow(0 20px 40px rgba(0,0,0,.6))}
  .words{flex:1;z-index:1}
  .title{font-family:var(--font-heading);font-size:124px;line-height:.95;color:var(--fg);text-transform:uppercase;
    -webkit-text-stroke:8px #000;paint-order:stroke fill;text-shadow:0 10px 30px rgba(0,0,0,.7)}
  .emoji{font-size:150px;line-height:1;margin-bottom:10px}
  .sub{margin-top:22px;font-family:var(--font-body);font-weight:700;font-size:40px;color:var(--accent2)}
</style></head><body>
<div class="frame" style="--glow:{{{glow}}}">
  {{#icon}}<div class="icon"><img src="{{{icon}}}"></div>{{/icon}}
  <div class="words">
    {{#emoji}}<div class="emoji">{{emoji}}</div>{{/emoji}}
    <h1 class="title">{{text}}</h1>
    {{#sub}}<div class="sub">{{sub}}</div>{{/sub}}
  </div>
</div></body></html>
