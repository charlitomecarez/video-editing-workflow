<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;box-sizing:border-box}
  body{width:1920px;height:1080px;overflow:hidden;background:var(--cbg);color:#fff;position:relative;
    display:flex;align-items:center;justify-content:center}
  body.top{align-items:flex-start;padding-top:70px}
  .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .text{position:relative;font-family:"Arial Rounded MT Bold","Nunito","Arial Black",sans-serif;font-weight:700;
    font-size:calc(var(--sz) * 1px);line-height:1.08;text-align:center;max-width:1760px;padding:0 60px;
    transform:rotate(calc(var(--tilt) * 1deg));
    -webkit-text-stroke:calc(var(--sz) * .075px) #000;paint-order:stroke fill;
    text-shadow:0 calc(var(--sz) * .045px) 0 #000,0 0 calc(var(--sz) * .12px) rgba(0,0,0,.55)}
  .hl{color:var(--hc)}
  .inl{display:inline-block;height:2em;max-width:3em;object-fit:contain;vertical-align:middle;margin:0 .12em;
    border-radius:.08em;transform:translateY(-.06em) rotate(-2deg);
    box-shadow:0 .06em .2em rgba(0,0,0,.5)}
</style></head>
<body class="{{position}}" style="--tilt:{{tilt}};--hc:{{color}};--sz:{{size}};--cbg:{{background}}">
{{#bg}}<img class="bgimg" src="{{{bg}}}">{{/bg}}
<div class="text" id="t">{{text}}</div>
{{#img}}<img id="src" src="{{{img}}}" style="display:none">{{/img}}
<script>
  const b = document.body, t = document.getElementById("t");
  if (!getComputedStyle(b).getPropertyValue("--hc").trim()) b.style.setProperty("--hc", "var(--accent)");
  if (document.querySelector(".bgimg") && !b.className.trim()) b.className = "top";
  const src = document.getElementById("src");
  if (src) t.innerHTML = t.innerHTML.replace("[img]", `<img class="inl" src="${src.src}">`);
  // Shrink long text so it always fits
  const maxH = document.querySelector(".bgimg") ? 380 : 900;
  for (let i = 0; i < 40 && (t.scrollWidth > 1780 || t.getBoundingClientRect().height > maxH); i++)
    b.style.setProperty("--sz", parseFloat(getComputedStyle(b).getPropertyValue("--sz")) * 0.92);
</script>
</body></html>
