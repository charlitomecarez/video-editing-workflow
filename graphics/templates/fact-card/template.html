<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;box-sizing:border-box}
  body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;
    background-image:radial-gradient(ellipse at center,rgba(255,255,255,.05),transparent 65%)}
  .card{width:1380px;background:#fbfaf7;color:#16181d;padding:64px 80px 52px;border-radius:6px;box-shadow:0 40px 100px rgba(0,0,0,.7);
    transform:rotate(calc(var(--tilt) * 1deg));font-family:Georgia,"Times New Roman",serif}
  .label{display:inline-block;font:800 28px var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--lc);padding:8px 18px;border-radius:4px;margin-bottom:28px}
  .headline{font-size:78px;line-height:1.08;font-weight:700}
  .body{font-size:44px;line-height:1.4;margin-top:30px;color:#2b2f36}
  .hl{background:#ffb02e;color:#111;padding:0 6px;border-radius:3px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .source{margin-top:40px;padding-top:20px;border-top:2px solid #e2e0da;font:600 26px var(--font-body);color:#6b6f78}
</style></head><body style="--tilt:{{tilt}};--lc:{{color}}">
<div class="card">
  {{#label}}<div class="label">{{label}}</div>{{/label}}
  <div class="headline">{{headline}}</div>
  {{#body}}<div class="body">{{body}}</div>{{/body}}
  {{#source}}<div class="source">{{source}}</div>{{/source}}
</div>
<script>if (!getComputedStyle(document.body).getPropertyValue("--lc").trim()) document.body.style.setProperty("--lc", "var(--accent)");</script>
</body></html>
