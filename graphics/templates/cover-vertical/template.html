<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .shade{position:absolute;inset:0;background:rgba(0,0,0,{{{dim}}})}
  /* 4:5 grid crop = center 1080x1350; keep text in there */
  .safe{position:absolute;left:70px;right:70px;top:285px;height:1350px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:30px}
  .title{font-family:var(--font-heading);font-size:132px;line-height:.98;color:var(--fg);text-align:center;text-transform:uppercase;
    -webkit-text-stroke:12px #000;paint-order:stroke fill;text-shadow:0 12px 30px rgba(0,0,0,.6)}
  .sub{font-family:var(--font-heading);font-size:56px;background:var(--accent);color:#000;padding:12px 34px;border-radius:16px}
</style></head><body>
{{#bg}}<img class="bg" src="{{{bg}}}">{{/bg}}<div class="shade"></div>
<div class="safe"><h1 class="title">{{text}}</h1>{{#sub}}<div class="sub">{{sub}}</div>{{/sub}}</div>
</body></html>
