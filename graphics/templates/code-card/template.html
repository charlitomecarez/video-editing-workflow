<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:transparent;display:flex;align-items:center;justify-content:center}
  .card{display:inline-block;max-width:1760px;width:{{{width}}};border-radius:18px;overflow:hidden;
    background:#0d1117;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.08);margin:40px}
  .bar{display:flex;align-items:center;gap:12px;padding:18px 24px;background:rgba(255,255,255,.05)}
  .dot{width:18px;height:18px;border-radius:50%} .r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  .name{margin-left:14px;font-family:var(--font-body);font-size:22px;color:rgba(255,255,255,.55)}
  .code pre{margin:0;padding:30px 40px 38px;font-family:var(--font-code);font-size:{{{size}}}px;line-height:1.5;
    white-space:pre;background:transparent!important}
  .code pre code{font-family:inherit}
</style></head><body>
<div class="card">
  <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    {{#title}}<span class="name">{{title}}</span>{{/title}}</div>
  <div class="code">{{{code_html}}}</div>
</div></body></html>
