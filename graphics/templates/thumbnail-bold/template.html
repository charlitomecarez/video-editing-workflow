<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
  .frame{position:relative;width:100%;height:100%;overflow:hidden;
    background:radial-gradient(circle at 70% 40%, color-mix(in srgb,var(--accent2) 35%,var(--bg)) 0%, var(--bg) 70%)}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,{{{dim}}}) 30%,rgba(0,0,0,calc({{{dim}}} * .4)))}
  .side-left .shade{transform:scaleX(-1)}
  .subject{position:absolute;bottom:0;height:96%;max-width:58%;object-fit:contain;
    filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px #fff) drop-shadow(0 18px 30px rgba(0,0,0,.6))}
  .side-right .subject{right:-1%} .side-left .subject{left:-1%}
  .title{position:absolute;top:50%;transform:translateY(-50%);width:60%;
    font-family:var(--font-heading);font-size:118px;line-height:.95;color:var(--fg);text-transform:uppercase;
    -webkit-text-stroke:10px #000;paint-order:stroke fill;text-shadow:0 10px 28px rgba(0,0,0,.65);letter-spacing:-1px}
  .side-right .title{left:52px} .side-left .title{right:52px;text-align:right}
  .badge{position:absolute;top:34px;padding:10px 22px;border-radius:14px;background:var(--accent);color:#000;
    font-family:var(--font-heading);font-size:42px;transform:rotate(-3deg);box-shadow:0 8px 20px rgba(0,0,0,.5)}
  .side-right .badge{left:48px} .side-left .badge{right:48px}
  .logo{position:absolute;bottom:34px;height:84px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
  .side-right .logo{left:52px} .side-left .logo{right:52px}
</style></head><body>
<div class="frame side-{{side}}">
  {{#bg}}<img class="bg" src="{{{bg}}}">{{/bg}}
  <div class="shade"></div>
  {{#subject}}<img class="subject" src="{{{subject}}}">{{/subject}}
  <h1 class="title">{{text}}</h1>
  {{#badge}}<div class="badge">{{badge}}</div>{{/badge}}
  {{#logo}}<img class="logo" src="{{{logo}}}">{{/logo}}
</div></body></html>
