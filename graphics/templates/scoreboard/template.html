<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;box-sizing:border-box}
  body{width:1920px;height:1080px;background:var(--bg);overflow:hidden;font-family:var(--font-body);color:var(--fg)}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.9)}
  .shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,calc(var(--dim) - .15)) 0%,rgba(0,0,0,var(--dim)) 70%)}
  .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
  .tag{font-family:var(--font-heading);font-size:40px;letter-spacing:.12em;background:var(--accent);color:#000;padding:10px 30px;border-radius:8px}
  .board{display:flex;align-items:stretch;border-radius:28px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.6)}
  .team{width:640px;padding:46px 40px 40px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .name{font-family:var(--font-heading);font-size:72px;letter-spacing:.04em}
  .score{font-family:var(--font-heading);font-size:230px;line-height:1}
  .team.lose .score{opacity:.45}
  .vs{width:120px;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:var(--font-heading);font-size:44px;color:var(--fg);opacity:.95}
  .sub{font-weight:700;font-size:40px;background:rgba(0,0,0,.6);padding:12px 30px;border-radius:12px}
</style></head><body style="--dim:{{dim}}">
{{#bg}}<img class="bg" src="{{{bg}}}"><div class="shade"></div>{{/bg}}
<div class="wrap">
  {{#tag}}<div class="tag">{{tag}}</div>{{/tag}}
  <div class="board">
    <div class="team" id="L" style="background:{{left_color}}"><div class="name">{{left_name}}</div>{{#left_score}}<div class="score">{{left_score}}</div>{{/left_score}}</div>
    <div class="vs" id="vs">VS</div>
    <div class="team" id="R" style="background:{{right_color}}"><div class="name">{{right_name}}</div>{{#right_score}}<div class="score">{{right_score}}</div>{{/right_score}}</div>
  </div>
  {{#sub}}<div class="sub">{{sub}}</div>{{/sub}}
</div>
<script>
  const s = (id) => parseFloat(document.querySelector(`#${id} .score`)?.textContent);
  const l = s("L"), r = s("R");
  if (!isNaN(l) && !isNaN(r)) {
    document.getElementById("vs").textContent = "–";
    if (l !== r) document.getElementById(l > r ? "R" : "L").classList.add("lose");
  }
</script>
</body></html>
