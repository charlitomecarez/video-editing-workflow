<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;box-sizing:border-box}
  body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);background-image:radial-gradient(ellipse at center,rgba(255,255,255,.05),transparent 65%);color:var(--fg);font-family:var(--font-body);padding:80px 140px 70px;display:flex;flex-direction:column}
  .title{font-family:var(--font-heading);font-size:76px;line-height:1.05}
  .sub{font-size:36px;font-weight:600;opacity:.75;margin-top:12px}
  .legend{display:flex;gap:44px;margin-top:28px;font-size:34px;font-weight:800}
  .legend span::before{content:"";display:inline-block;width:30px;height:30px;border-radius:6px;background:var(--c);margin-right:14px;vertical-align:-4px;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
  .chart{flex:1;display:flex;align-items:flex-end;gap:90px;margin-top:40px;border-bottom:4px solid rgba(255,255,255,.3);padding:0 40px}
  .group{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;gap:22px;position:relative}
  .bar{width:46%;border-radius:14px 14px 0 0;position:relative;box-shadow:inset 0 0 0 3px rgba(255,255,255,.18)}
  .bar .v{position:absolute;left:0;right:0;top:-74px;text-align:center;font-family:var(--font-heading);font-size:58px}
  .dim .bar:not(.hot){opacity:.38}
  .bar.hot{box-shadow:0 0 0 8px var(--accent),0 0 60px color-mix(in srgb,var(--accent) 60%,transparent)}
  .bar.hot .v{color:var(--accent);font-size:84px;top:-104px}
  .labels{display:flex;gap:90px;padding:0 40px;margin-top:16px}
  .labels div{flex:1;text-align:center;font-family:var(--font-heading);font-size:44px;opacity:.85}
</style></head><body>
<template id="d"><i>{{labels}}</i><i>{{a_values}}</i><i>{{b_values}}</i><i>{{highlight}}</i></template>
<div class="title">{{title}}</div>
{{#sub}}<div class="sub">{{sub}}</div>{{/sub}}
<div class="legend"><span style="--c:{{a_color}}">{{a_name}}</span><span style="--c:{{b_color}}">{{b_name}}</span></div>
<div class="chart" id="chart"></div>
<div class="labels" id="labels"></div>
<script>
  const [labels, av, bv, hi] = [...document.getElementById("d").content.querySelectorAll("i")].map((x) => x.textContent.trim());
  const split = (s) => s.split(";").map((x) => x.trim()).filter((x) => x !== "");
  const L = split(labels), A = split(av).map(Number), B = split(bv).map(Number);
  const max = Math.max(...A, ...B) * 1.12;
  const colors = { a: "{{a_color}}", b: "{{b_color}}" };
  const chart = document.getElementById("chart");
  if (hi) chart.classList.add("dim");
  L.forEach((lab, i) => {
    const g = document.createElement("div");
    g.className = "group";
    [["a", A[i]], ["b", B[i]]].forEach(([k, v]) => {
      if (v == null || isNaN(v)) return;
      const hot = hi === `${k}${i + 1}` ? " hot" : "";
      g.insertAdjacentHTML("beforeend", `<div class="bar${hot}" style="height:${(v / max) * 100}%;background:${colors[k]}"><div class="v">${v}</div></div>`);
    });
    chart.appendChild(g);
    document.getElementById("labels").insertAdjacentHTML("beforeend", `<div>${lab}</div>`);
  });
</script>
</body></html>
