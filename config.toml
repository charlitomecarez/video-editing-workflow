# Video Editing Workflow config
#
# Every tool reads its settings from here. Don't edit this file for personal tweaks:
# create config.local.toml (git-ignored) and put only the keys you want to change, e.g.
#
#   [creator]
#   name = "Charlito"
#   [subtitles]
#   language = "tl"
#
# Precedence: command-line flags > config.local.toml > config.toml
# Check the merged result: python3 tools/vwconfig.py show

[creator]
name = "Your Name"
channel = "Your Channel"
# Who the videos are for. Used by /topics and /script.
audience = "beginners who want simple, practical tips"
# Voice of the scripts: casual, energetic, calm, funny, professional...
tone = "casual and friendly"
# Script language. "Taglish" works too if you want mixed Tagalog/English.
language = "English"
platforms = ["tiktok", "youtube-shorts", "instagram-reels", "youtube"]
# Niches from topics/niches.json to use when none is given. Empty = all.
niches = []
# Words or topics Claude should avoid in scripts.
avoid = []

[personality]
# Your on-camera voice. Claude reads this file before writing or punching up scripts.
# Make more profiles (e.g. personality/calm-teacher.md) and switch here.
profile = "personality/bestfriend.md"
# 0 = no jokes, 1 = light, 2 = friendly, 3 = funny, 4 = very funny, 5 = unhinged.
# Styles can override this with their own humor_level.
humor_level = 3
# Roughly one laugh every N seconds (ignored when humor_level = 0)
joke_every_seconds = 18
# none / mild ("damn", "hell") / bleeped (write it, mark it [BLEEP]) / uncensored
profanity = "mild"
dark_humor = false
self_deprecating = true
# Allow meme / reaction-clip cutaways in the See column
meme_cutaways = true
# What the jokes may target. Never people's looks, identity or intelligence.
punch_at = ["technologies and companies", "hype and marketing", "bad practices", "myself"]
# Phrases tools/cringe_check.py flags (case-insensitive). Add your own pet peeves.
blocklist = [
  "hey guys", "welcome back", "in today's video", "without further ado", "smash that like",
  "don't forget to subscribe", "let's dive in", "dive into", "deep dive", "buckle up",
  "game changer", "game-changer", "mind-blowing", "mind blowing", "you won't believe",
  "no cap", "it's giving", "rizz", "slay", "lol", "haha", "spoiler alert", "plot twist",
  "delve", "in the ever-evolving", "ever-changing landscape", "unleash", "elevate", "seamless",
  "robust", "it's worth noting", "in conclusion", "secret sauce", "a testament to",
  "imagine a world", "ever wondered", "level up your", "look no further", "at the end of the day",
  "the world of", "navigate the", "harness the power", "revolutionize", "cutting-edge",
]
# Words that are fine once but cringe when repeated: max uses per script
intensifiers = { literally = 2, insane = 1, crazy = 2, super = 2, really = 4, very = 3, actually = 4, honestly = 3, basically = 2 }
max_sentence_words = 22
# Max exclamation marks per 100 words
max_exclamations_per_100 = 1.0

[paths]
projects = "projects"
scripts = "video-scripts"
ideas = "topics/ideas.md"

[project]
# Subfolders created by tools/new_project.py
folders = ["footage", "audio", "graphics", "export", "thumbnails"]
date_prefix = true

[topics]
count = 10
style = "short-form"

[script]
default_style = "short-form"
# Layout: "sections" (voiceover / on-screen text / B-roll per section),
# "av-table" (3-column See | Hear | Notes table per section), or
# "auto" (use the style's script_format, else sections)
format = "auto"
# Average speaking rate, used to size voiceover per section (2.3-2.8 is typical).
# A style can override it with its own words_per_second.
words_per_second = 2.5
hook_options = 3
# Sections to include in generated scripts
include = ["hooks", "script", "shot_list", "editing_notes", "checklist", "post", "results"]
checklist = [
  "Project profile matches the style (resolution and fps)",
  "Footage prepped (tools/prep.sh) and proxies on",
  "Silences cut (tools/cut-silence.sh) and reviewed",
  "B-roll, text and music added",
  "Subtitles generated (tools/subtitles.sh) and checked",
  "Audio: voice around -6 dB peak, music under it",
  "Rendered and watched once fully before posting",
]

[prep]
fps = 30
# Lower CRF = higher quality and bigger file (16-23 is sensible)
crf = 18
# ultrafast ... veryslow (slower = smaller file, same quality)
preset = "medium"
# Loudness target in LUFS (-14 for YouTube / TikTok, -16 for podcasts)
loudness = -14
audio_bitrate = "192k"
# Set false to keep the original audio untouched
normalize_audio = true

[silence]
# Padding kept around speech. Bigger = less choppy.
margin = "0.2s"
# Audio level that counts as silence. Raise it if room noise is loud.
threshold = "4%"
# Export: kdenlive (review cuts on the timeline) or "default" (a rendered video)
export = "kdenlive"

[subtitles]
# tiny, base, small, medium, large, turbo
model = "small"
# "" = auto-detect. Examples: en, tl, es
language = ""
format = "srt"
# Max characters per line (short-form looks best with short lines)
max_line_width = 32
max_line_count = 2

[captions]
# Burned-in caption style, used by tools/burn-captions.sh
font = "Arial Black"
size = 18
color = "&H00FFFFFF"        # ASS colors are &HAABBGGRR. This is white.
outline_color = "&H00000000" # black
outline = 3
# Distance from the bottom edge
margin_v = 60
bold = true

[vertical]
# crop = fill frame by cropping, blur = fit over a blurred background
mode = "crop"
width = 1080
height = 1920
blur_strength = 20

[thumbnails]
count = 12
width = 1280

[analyze]
# Scene-change sensitivity for tools/analyze_cuts.py (0-1). Lower = detects more cuts.
# 0.3 suits most edits; try 0.2 for subtle cuts, 0.4 if motion causes false cuts.
threshold = 0.3
# Cuts closer together than this (seconds) are merged (flashes, glitches)
min_shot = 0.15
# Save one frame per shot for a visual breakdown
save_frames = false

[brand]
# Used by every graphic template (tools/graphic) and the Motion Canvas animations.
bg = "#0d1117"        # main background
bg2 = "#161b22"       # secondary background (diagram boxes, panels)
fg = "#ffffff"        # text
accent = "#ffd400"    # highlight color (*word* in text fields)
accent2 = "#00e5ff"   # second accent (glows, lines)
# Any installed font, or a web font loaded via font_css
font_heading = "Arial Black, Impact, sans-serif"
font_body = "Helvetica Neue, Arial, sans-serif"
font_code = "Menlo, SF Mono, monospace"
# Optional web fonts, e.g. "https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap"
# (then set font_heading = "Montserrat, sans-serif")
font_css = ""
# Shiki theme for code cards: github-dark, dracula, one-dark-pro, tokyo-night, nord...
code_theme = "github-dark"
# Path to your logo (relative to the repo), added to templates with a logo slot
logo = ""

[graphics]
# chrome = use your installed Google Chrome; chromium = Playwright's bundled browser
browser = "chrome"
output_dir = "graphics/out"
# 2 = render at double resolution (sharper, bigger files)
scale = 1

[cutout]
# Background-removal model for tools/cutout.sh:
#   u2net (general), isnet-general-use (sharper edges), u2net_human_seg (people),
#   birefnet-portrait (best for people, slower)
model = "isnet-general-use"

[tts]
# Draft voiceover with Piper (tools/voice-draft.sh). Hear voices: https://rhasspy.github.io/piper-samples/
# e.g. en_US-lessac-medium, en_US-ryan-high, en_GB-alan-medium, en_US-amy-medium
voice = "en_US-lessac-medium"
# 1.0 normal, 1.15 faster (tech-explainer pace), 0.9 slower
speed = 1.1
# Pause between sentences in seconds
sentence_pause = 0.15
voices_dir = ".voices"

[clean_voice]
# tools/clean-voice.sh
highpass = 80         # Hz, cuts rumble and hum
denoise = 12          # dB of noise reduction: 6 light, 12 normal, 20 strong
deess = false         # tame harsh "s" sounds
compress = true       # even out loud and quiet parts
loudness = -16        # LUFS for the voice track (music and mix get leveled at export)

[teleprompter]
font_size = 56
speed = 40            # scroll speed in px per second
mirror = false        # true for glass/beam-splitter teleprompters
line_width = 32       # characters per line
guide_position = 30   # reading line, % from top of screen

[render]
crf = 18
preset = "medium"
